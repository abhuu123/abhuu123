<g font-family="Arial,sans-serif">
 <text x="78" y="287" font-size="16" font-weight="700" fill="#fdba74">☁ CLOUD &amp; NETWORKING</text>
 <text x="78" y="321" font-size="16" fill="#e5e7eb">AWS · GCP · VPC · DNS</text><text x="78" y="347" font-size="16" fill="#e5e7eb">EC2 · EKS · GKE · Load Balancers</text><text x="78" y="378" font-size="12" fill="#94a3b8">Provision and operate secure cloud foundations</text>
 <text x="450" y="287" font-size="16" font-weight="700" fill="#c4b5fd">🧱 INFRASTRUCTURE AS CODE</text>
 <text x="450" y="321" font-size="16" fill="#e5e7eb">Terraform · Ansible</text><text x="450" y="347" font-size="16" fill="#e5e7eb">Repeatable environments · Configuration</text><text x="450" y="378" font-size="12" fill="#94a3b8">Make changes reviewable and reproducible</text>
 <text x="822" y="287" font-size="16" font-weight="700" fill="#6ee7b7">📡 OBSERVABILITY</text>
 <text x="822" y="321" font-size="16" fill="#e5e7eb">Prometheus · Grafana · CloudWatch</text><text x="822" y="347" font-size="16" fill="#e5e7eb">OpenTelemetry · Logs · Traces</text><text x="822" y="378" font-size="12" fill="#94a3b8">Spot anomalies and troubleshoot faster</text>
 <text x="78" y="462" font-size="16" font-weight="700" fill="#7dd3fc">📦 CONTAINERS &amp; RELEASES</text>
 <text x="78" y="496" font-size="16" fill="#e5e7eb">Docker · Kubernetes · Helm</text><text x="78" y="522" font-size="16" fill="#e5e7eb">Rolling updates · Health probes</text><text x="78" y="553" font-size="12" fill="#94a3b8">Deliver changes safely and consistently</text>
 <text x="450" y="462" font-size="16" font-weight="700" fill="#f9a8d4">🔐 SECURITY</text>
 <text x="450" y="496" font-size="16" fill="#e5e7eb">IAM · TLS · Secrets · Image scanning</text><text x="450" y="522" font-size="16" fill="#e5e7eb">Network boundaries · Least privilege</text><text x="450" y="553" font-size="12" fill="#94a3b8">Reduce exposure throughout delivery</text>
 <text x="822" y="462" font-size="16" font-weight="700" fill="#fde047">⚙ AUTOMATION</text>
 <text x="822" y="496" font-size="16" fill="#e5e7eb">Bash · Python · GitHub Actions</text><text x="822" y="522" font-size="16" fill="#e5e7eb">Jenkins · Repeatable runbooks</text><text x="822" y="553" font-size="12" fill="#94a3b8">Eliminate toil and standardize operations</text>
</g>
<text x="600" y="620" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">DESIGNED FOR REPEATABILITY • SECURITY • RELIABILITY</text>
</svg>