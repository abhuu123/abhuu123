<text x="600" y="211" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">FEEDBACK LOOP · METRICS · LOGS · TRACES</text>
<!-- capability cards -->
<g filter="url(#shadow)">
 <rect x="55" y="255" width="345" height="150" rx="12" fill="#101827" stroke="#fb923c"/>
 <rect x="427" y="255" width="345" height="150" rx="12" fill="#101827" stroke="#a78bfa"/>
 <rect x="799" y="255" width="346" height="150" rx="12" fill="#101827" stroke="#34d399"/>
 <rect x="55" y="430" width="345" height="150" rx="12" fill="#101827" stroke="#38bdf8"/>
 <rect x="427" y="430" width="345" height="150" rx="12" fill="#101827" stroke="#f472b6"/>
 <rect x="799" y="430" width="346" height="150" rx="12" fill="#101827" stroke="#facc15"/>
