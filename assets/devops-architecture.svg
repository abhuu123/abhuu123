<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">DevOps architecture lab</title><desc id="desc">A source-to-production workflow with six capability lanes.</desc>
<defs>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00e5ff"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect width="1200" height="650" rx="18" fill="#080d17"/>
<text x="600" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#e5e7eb">DEVOPS DELIVERY &amp; OPERATIONS MAP</text>
<text x="600" y="70" text-anchor="middle" font-family="monospace" font-size="13" fill="#94a3b8">FROM COMMIT TO OBSERVABILITY</text>
<!-- pipeline -->
<g filter="url(#shadow)">
 <rect x="55" y="100" width="210" height="85" rx="12" fill="url(#panel)" stroke="#00e5ff" stroke-width="1.5"/>
 <rect x="295" y="100" width="210" height="85" rx="12" fill="url(#panel)" stroke="#38bdf8" stroke-width="1.5"/>
 <rect x="535" y="100" width="210" height="85" rx="12" fill="url(#panel)" stroke="#a78bfa" stroke-width="1.5"/>
 <rect x="775" y="100" width="160" height="85" rx="12" fill="url(#panel)" stroke="#34d399" stroke-width="1.5"/>
 <rect x="965" y="100" width="180" height="85" rx="12" fill="url(#panel)" stroke="#fb923c" stroke-width="1.5"/>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <text x="160" y="132" font-size="14" fill="#67e8f9">01 / SOURCE</text><text x="160" y="158" font-size="20" font-weight="700" fill="#f8fafc">Git · GitHub</text>
 <text x="400" y="132" font-size="14" fill="#7dd3fc">02 / BUILD</text><text x="400" y="158" font-size="20" font-weight="700" fill="#f8fafc">Jenkins · Actions</text>
 <text x="640" y="132" font-size="14" fill="#c4b5fd">03 / PACKAGE</text><text x="640" y="158" font-size="20" font-weight="700" fill="#f8fafc">Docker · Registry</text>
 <text x="855" y="132" font-size="14" fill="#6ee7b7">04 / DEPLOY</text><text x="855" y="158" font-size="19" font-weight="700" fill="#f8fafc">Kubernetes</text>
 <text x="1055" y="132" font-size="14" fill="#fdba74">05 / OPERATE</text><text x="1055" y="158" font-size="19" font-weight="700" fill="#f8fafc">Cloud platforms</text>
</g>
<g fill="none" stroke="url(#cyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
 <path d="M265 142h30"/><path d="M286 135l9 7-9 7"/>
 <path d="M505 142h30"/><path d="M526 135l9 7-9 7"/>
 <path d="M745 142h30"/><path d="M766 135l9 7-9 7"/>
 <path d="M935 142h30"/><path d="M956 135l9 7-9 7"/>
